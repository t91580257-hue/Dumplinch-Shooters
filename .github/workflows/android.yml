
name: Build DUMPLINCH SHOOTERS Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Extract game project
        run: |
          mkdir -p game_src

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found in repository root"
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"

          unzip -oq "$ZIP_FILE" -d game_src

          PROJECT_FILE=$(find game_src -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Fix project permissions
        run: |
          chmod -R u+rwX "$PROJECT_DIR"

      - name: Download Godot 4.3
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q Godot_v4.3-stable_linux.x86_64.zip

          chmod +x Godot_v4.3-stable_linux.x86_64

          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Download and install Godot export templates
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          mkdir -p /tmp/godot-templates

          unzip -q \
            Godot_v4.3-stable_export_templates.tpz \
            -d /tmp/godot-templates

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$TEMPLATE_DIR"

          cp -r /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"

          echo "Installed export templates:"
          ls -lah "$TEMPLATE_DIR"

          if [ ! -f "$TEMPLATE_DIR/android_source.zip" ]; then
            echo "ERROR: android_source.zip not found in export templates"
            exit 1
          fi

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            echo "ERROR: android_debug.apk not found"
            exit 1
          fi

      - name: Install Android Gradle build template manually
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$PROJECT_DIR/android/build"
          mkdir -p "$PROJECT_DIR/android/plugins"

          unzip -oq \
            "$TEMPLATE_DIR/android_source.zip" \
            -d "$PROJECT_DIR/android/build"

          touch "$PROJECT_DIR/android/build/.gdignore"

          echo "4.3.stable" > "$PROJECT_DIR/android/.build_version"

          if [ ! -f "$PROJECT_DIR/android/build/build.gradle" ]; then
            echo "ERROR: build.gradle was not found after extraction"

            echo "Android directory contents:"
            find "$PROJECT_DIR/android" -maxdepth 4 -type f

            exit 1
          fi

          echo "Android Gradle template installed successfully"

          ls -lah "$PROJECT_DIR/android/build"

      - name: Create Android export preset
        run: |
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk=24
          gradle_build/target_sdk=34
          package/unique_name="com.dumplinch.shooters"
          package/name="DUMPLINCH SHOOTERS"
          package/signed=true
          screen/immersive_mode=true
          screen/orientation=0
          version/code=1
          version/name="0.1.0"
          EOF

      - name: Configure Android SDK for Godot
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Import project and check scripts
        run: |
          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --import \
            --quit

      - name: Verify Android template
        run: |
          if [ ! -f "$PROJECT_DIR/android/build/build.gradle" ]; then
            echo "ERROR: Android Gradle template is missing"
            exit 1
          fi

          echo "Android template check passed"

      - name: Build Debug APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/dumplinch-shooters-debug.apk"

          if [ ! -s "$GITHUB_WORKSPACE/build/dumplinch-shooters-debug.apk" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK created successfully"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DUMPLINCH-SHOOTERS-DEBUG
          path: build/dumplinch-shooters-debug.apk
          if-no-files-found: error
