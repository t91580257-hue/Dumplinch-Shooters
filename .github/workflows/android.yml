name: Build DUMPLINCH SHOOTERS Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Extract game project
        run: |
          mkdir -p game_src

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found in repository root"
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"

          unzip -oq "$ZIP_FILE" -d game_src

          PROJECT_FILE=$(find game_src -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project found: $PROJECT_DIR"

      - name: Fix project permissions
        run: |
          chmod -R u+rwX "$PROJECT_DIR"

      - name: Download Godot 4.3
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q Godot_v4.3-stable_linux.x86_64.zip

          chmod +x Godot_v4.3-stable_linux.x86_64

          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          mkdir -p /tmp/godot-templates

          unzip -q \
            Godot_v4.3-stable_export_templates.tpz \
            -d /tmp/godot-templates

          cp -r \
            /tmp/godot-templates/templates/. \
            ~/.local/share/godot/export_templates/4.3.stable/

          echo "Godot export templates installed"

      - name: Create Android export preset
        run: |
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk=24
          gradle_build/target_sdk=34
          package/unique_name="com.dumplinch.shooters"
          package/name="DUMPLINCH SHOOTERS"
          package/signed=true
          screen/immersive_mode=true
          screen/orientation=0
          version/code=1
          version/name="0.1.0"
          EOF

          echo "Android export preset created"

      - name: Import project resources
        run: |
          godot --headless --editor \
            --path "$PROJECT_DIR" \
            --import --quit

      - name: Install Android build template
        run: |
          godot --headless --editor \
            --path "$PROJECT_DIR" \
            --install-android-build-template \
            --quit

          if [ ! -f "$PROJECT_DIR/android/build/build.gradle" ]; then
            echo "ERROR: Android Gradle build template was not installed"

            if [ -d "$PROJECT_DIR/android" ]; then
              find "$PROJECT_DIR/android" -maxdepth 4 -type f
            fi

            exit 1
          fi

          echo "Android build template installed successfully"

      - name: Build Debug APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/dumplinch-shooters-debug.apk"

          if [ ! -s "$GITHUB_WORKSPACE/build/dumplinch-shooters-debug.apk" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK successfully created"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DUMPLINCH-SHOOTERS-DEBUG
          path: build/dumplinch-shooters-debug.apk
          if-no-files-found: error
